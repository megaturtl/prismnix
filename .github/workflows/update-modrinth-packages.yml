name: Update Modrinth packages

on:
  schedule:
    # 01:15 UTC on odd-numbered dates of the month
    - cron: "15 1 */2 * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: update-modrinth-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: true
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.1

      - name: Update package database using Modrinth API
        env:
          PRISMGEN_USER_AGENT: "github:${{ github.repository }}/prismgen"
        run: |
          nix run --no-write-lock-file .#prismgen -- \
            database packages/database/database.json \
            --fetch-new-versions \
            --search packages/database/search.json \
            --session-user-agent "$PRISMGEN_USER_AGENT" \
            --session-limit 240 \
            --session-batch-size 500

      - name: Regenerate Modrinth packages from the stored database
        run: |
          nix run --no-write-lock-file .#prismgen -- \
            nix packages/database/database.json packages/projects \
            --template packages/database/template

      - name: Update loaders
        env:
          PRISMGEN_USER_AGENT: "github:${{ github.repository }}/prismgen"
        run: |
          nix run --no-write-lock-file .#prismgen -- \
            prismmeta \
            -p "net.fabricmc.fabric-loader=fabric" \
            -p "org.quiltmc.quilt-loader=quilt" \
            -p "net.minecraftforge=forge" \
            -p "net.neoforged=neoforge" \
            -p "com.mumfrey.liteloader=liteloader" \
            --session-user-agent "$PRISMGEN_USER_AGENT" \
            --session-limit 10 \
            lib/components/loaders.nix

      - name: Stage changes
        id: changes
        run: |
          git add -- packages/projects lib/components/loaders.nix
          updated=$(git diff --cached --no-renames --name-only --diff-filter=M -- 'packages/projects/????????.nix' | wc -l)
          added=$(git diff --cached --no-renames --name-only --diff-filter=A -- 'packages/projects/????????.nix' | wc -l)
          removed=$(git diff --cached --no-renames --name-only --diff-filter=D -- 'packages/projects/????????.nix' | wc -l)
          {
            echo "updated=$updated"
            echo "added=$added"
            echo "removed=$removed"
          } >> "$GITHUB_OUTPUT"

      - name: Check the generated flake
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix flake check --impure --no-write-lock-file

      - name: Create or update the pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: auto/update-packages
          delete-branch: true
          add-paths: |
            packages/database/database.json
            packages/projects
            lib/components/loaders.nix
          commit-message: |
            auto: update Modrinth packages
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "auto: update Modrinth packages"
          body: |
            Triggered by the cron timer (roughly every 2 days).

            - Updated projects: ${{ steps.changes.outputs.updated }}
            - Added projects: ${{ steps.changes.outputs.added }}
            - Removed projects: ${{ steps.changes.outputs.removed }}
            - Updated component loader versions

            The updated project catalogue has passed `nix flake check`.